<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Adjustments - Quick Buy Retail</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1>Stock Adjustments</h1>
      <span class="user-chip" id="userInfo"></span>
    </header>
    <section class="content">
      <div style="max-width: 600px;" class="panel">
        <h2>✏️ Record Stock Adjustment</h2>
        <form id="adjForm" style="margin-top: 16px;">
          <div class="field">
            <label>Select Product *</label>
            <select id="product_id" required><option value="">-- Choose Product --</option></select>
          </div>
          <div class="row2">
            <div class="field">
              <label>Adjustment Type *</label>
              <select id="type" required>
                <option value="received">Receive Stock (+)</option>
                <option value="damaged">Damaged Goods (-)</option>
                <option value="expired">Expired Stock (-)</option>
                <option value="adjustment">Manual Adjustment (-)</option>
              </select>
            </div>
            <div class="field">
              <label>Quantity *</label>
              <input type="number" id="quantity" min="1" step="1" required placeholder="e.g. 10">
            </div>
          </div>
          <div class="field">
            <label>Reason / Reference Note *</label>
            <input type="text" id="reason" required maxlength="255" placeholder="e.g. Delivery arrival, broken packaging, audit correction">
          </div>
          <div class="form-error" id="formError"></div>
          <button class="btn btn-ok" type="submit">Submit Adjustment</button>
        </form>
      </div>
    </section>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/stock_adjustments.js"></script>
</body>
</html>
