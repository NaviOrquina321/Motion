<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports - Quick Buy Retail</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><h1>Reports</h1><span class="user-chip" id="userInfo"></span></header>
    <section class="content">
      <div class="toolbar"><select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select>
        <span class="user-chip">Calculated by the Python report service</span></div>
      <div class="cards" id="cards"></div>
      <div class="panel"><h2>Daily Revenue</h2><div class="bars" id="bars"></div></div>
      <div class="row2"><div class="panel"><h2>Top Products</h2><div class="table-wrap" id="top"></div></div>
      <div class="panel"><h2>Revenue by Category</h2><div class="table-wrap" id="cat"></div></div></div>
    </section>
  </main>
</div>
<script src="js/common.js"></script><script src="js/reports.js"></script>
</body></html>
