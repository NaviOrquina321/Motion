<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories - Quick Buy Retail</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><h1>Categories</h1><span class="user-chip" id="userInfo"></span></header>
    <section class="content">
      <div class="toolbar"><div class="grow"></div><button class="btn" id="addBtn">+ Add Category</button></div>
      <div class="panel"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Description</th><th class="num">Products</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
      <div class="modal" id="formModal"><form class="modal-box" id="form" novalidate><h2 id="formTitle">Add Category</h2>
        <input type="hidden" id="id">
        <div class="field"><label>Name *</label><input type="text" id="name" maxlength="80"></div>
        <div class="field"><label>Description</label><input type="text" id="description" maxlength="255"></div>
        <div class="form-error" id="formError"></div>
        <div class="modal-actions"><button type="button" class="btn btn-light" data-close="formModal">Cancel</button><button class="btn">Save</button></div>
      </form></div>
    </section>
  </main>
</div>
<script src="js/common.js"></script><script src="js/categories.js"></script>
</body></html>
