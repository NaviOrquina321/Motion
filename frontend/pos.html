<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POS Terminal - Quick Buy Retail</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1>POS Terminal</h1>
      <span class="user-chip" id="userInfo"></span>
    </header>
    <section class="content">
      <div class="pos-container">
        <!-- Left Column: Search, Categories, Product Cards Grid -->
        <div class="pos-left">
          <div class="toolbar">
            <input class="grow" type="text" id="search" placeholder="🔍 Search products or scan barcode..." autofocus>
          </div>
          <div class="pos-cats" id="catTabs">
            <button class="cat-tab active" data-id="">All Categories</button>
          </div>
          <div class="pos-grid-wrap">
            <div class="product-grid" id="grid"></div>
          </div>
        </div>

        <!-- Right Column: Current Sale Ticket -->
        <div class="pos-ticket">
          <h2>
            <span>🛒 Current Ticket</span>
            <button class="btn btn-sm btn-light" id="clearBtn">Clear</button>
          </h2>

          <div class="field" style="margin-bottom:8px">
            <select id="customer"><option value="">Walk-in Customer</option></select>
          </div>

          <div class="field" style="margin-bottom:8px">
            <select id="discount"><option value="">No Discount</option></select>
          </div>

          <div class="ticket-items" id="cartItems"></div>

          <div class="ticket-totals">
            <div><span>Subtotal</span><span id="subtotal">₱0.00</span></div>
            <div id="discRow" class="hidden" style="color:var(--danger)"><span>Discount</span><span id="discAmt">-₱0.00</span></div>
            <div id="taxRow" class="hidden"><span>Tax (<span id="taxRateLabel">0</span>%)</span><span id="taxAmt">₱0.00</span></div>
            <div class="grand"><span>Total</span><span id="total">₱0.00</span></div>
          </div>

          <!-- Payment Methods -->
          <div style="margin-bottom:8px">
            <label style="font-size:12px; font-weight:600; color:var(--muted)">Payment Method</label>
            <div class="pay-methods" style="margin-top:4px">
              <button class="pay-method-btn active" data-method="Cash">💵 Cash</button>
              <button class="pay-method-btn" data-method="GCash">📱 GCash</button>
              <button class="pay-method-btn" data-method="Maya">💳 Maya</button>
            </div>
          </div>

          <div class="field" id="refField" style="margin-bottom:8px; display:none">
            <label>Reference Number *</label>
            <input type="text" id="refNum" placeholder="e.g. 123456789">
          </div>

          <div class="field" id="payField" style="margin-bottom:8px">
            <label>Payment Amount (₱)</label>
            <input type="number" id="payment" min="0" step="0.01" placeholder="0.00" style="font-size:16px; font-weight:600">
          </div>

          <div class="ticket-totals" id="changeRow" style="margin:2px 0 8px">
            <div><span>Change</span><strong id="change" style="color:var(--primary); font-size:16px">₱0.00</strong></div>
          </div>

          <div class="form-error" id="payError"></div>

          <button class="btn btn-ok btn-lg" style="width:100%; margin-top: auto" id="payBtn">Charge Ticket</button>
        </div>
      </div>
      <div id="modalHost"></div>
    </section>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/pos.js"></script>
</body>
</html>
