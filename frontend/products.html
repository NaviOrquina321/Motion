<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products - Quick Buy Retail</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><h1>Products</h1><span class="user-chip" id="userInfo"></span></header>
    <section class="content">
      <div class="toolbar">
        <input class="grow" type="text" id="search" placeholder="Search by name or ID...">
        <select id="catFilter"><option value="">All categories</option></select>
        <button class="btn" id="addBtn">+ Add Product</button></div>
      <div class="panel"><div class="table-wrap"><table><thead><tr><th>Image</th><th>ID</th><th>Name</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th><th class="num">Reorder</th><th>Date Added</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
      <div class="modal" id="formModal"><form class="modal-box" id="form" novalidate><h2 id="formTitle">Add Product</h2>
        <input type="hidden" id="id">
        <div class="field"><label>Product Name *</label><input type="text" id="name" maxlength="120"></div>
        <div class="field"><label>Category *</label><select id="category_id"></select></div>
        <div class="row2"><div class="field"><label>Price *</label><input type="number" id="price" min="0" step="0.01"></div>
        <div class="field"><label>Stock Quantity *</label><input type="number" id="stock_quantity" min="0" step="1"></div></div>
        <div class="field"><label>Reorder Level *</label><input type="number" id="reorder_level" min="0" step="1" value="10"></div>
        <div class="field"><label>Product Image (JPG/PNG/GIF/WEBP, max 2 MB)</label><input type="file" id="image" accept="image/*"></div>
        <div class="form-error" id="formError"></div>
        <div class="modal-actions"><button type="button" class="btn btn-light" data-close="formModal">Cancel</button><button class="btn">Save</button></div>
      </form></div>
    </section>
  </main>
</div>
<script src="js/common.js"></script><script src="js/products.js"></script>
</body></html>
