<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discounts - Quick Buy Retail</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1>Discounts</h1>
      <span class="user-chip" id="userInfo"></span>
    </header>
    <section class="content">
      <div class="toolbar">
        <div class="grow"></div>
        <button class="btn" id="addBtn">+ Add Discount</button>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Discount Name</th>
                <th>Type</th>
                <th class="num">Value</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>

      <div class="modal" id="formModal">
        <form class="modal-box" id="form" novalidate>
          <h2 id="formTitle">Add Discount</h2>
          <input type="hidden" id="id">
          <div class="field">
            <label>Discount Name *</label>
            <input type="text" id="name" maxlength="100" required placeholder="e.g. Senior Citizen, Promo 10%">
          </div>
          <div class="row2">
            <div class="field">
              <label>Type *</label>
              <select id="type">
                <option value="percent">Percentage (%)</option>
                <option value="fixed">Fixed Amount (₱)</option>
              </select>
            </div>
            <div class="field">
              <label>Value *</label>
              <input type="number" id="value" min="0" step="0.01" required placeholder="e.g. 10 or 50">
            </div>
          </div>
          <div class="field">
            <label>Status</label>
            <select id="is_active">
              <option value="1">Active</option>
              <option value="0">Inactive</option>
            </select>
          </div>
          <div class="form-error" id="formError"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-light" data-close="formModal">Cancel</button>
            <button class="btn" type="submit">Save</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/discounts.js"></script>
</body>
</html>
