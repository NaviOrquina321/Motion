<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users - Quick Buy Retail</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><h1>Users</h1><span class="user-chip" id="userInfo"></span></header>
    <section class="content">
      <div class="toolbar"><div class="grow"></div><button class="btn" id="addBtn">+ Add User</button></div>
      <div class="panel"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Username</th><th>Full Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
      <div class="modal" id="formModal"><form class="modal-box" id="form" novalidate><h2 id="formTitle">Add User</h2>
        <input type="hidden" id="id">
        <div class="field"><label>Username *</label><input type="text" id="username" maxlength="50"></div>
        <div class="field"><label>Full Name *</label><input type="text" id="full_name" maxlength="100"></div>
        <div class="row2"><div class="field"><label>Role *</label><select id="role"><option value="cashier">Cashier</option><option value="admin">Admin</option></select></div>
        <div class="field"><label>Status</label><select id="is_active"><option value="1">Active</option><option value="0">Inactive</option></select></div></div>
        <div class="field"><label id="pwLabel">Password *</label><input type="password" id="password" autocomplete="new-password"></div>
        <div class="form-error" id="formError"></div>
        <div class="modal-actions"><button type="button" class="btn btn-light" data-close="formModal">Cancel</button><button class="btn">Save</button></div>
      </form></div>
    </section>
  </main>
</div>
<script src="js/common.js"></script><script src="js/users.js"></script>
</body></html>
