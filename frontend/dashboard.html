<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Quick Buy Retail</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1>Dashboard</h1>
      <span class="user-chip" id="userInfo"></span>
    </header>
    <section class="content">
      <div class="cards" id="cards"></div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;" class="row2">
        <div class="panel alert-panel">
          <h3>⚠️ Low Stock Alert</h3>
          <p style="font-size: 12px; color: var(--muted); margin-bottom: 12px;">Items reaching reorder level</p>
          <div class="table-wrap" id="lowStock"></div>
        </div>

        <div class="panel">
          <h3>🔥 Top 5 Products Sold</h3>
          <p style="font-size: 12px; color: var(--muted); margin-bottom: 12px;">Best performing items by quantity</p>
          <div class="table-wrap" id="topProducts"></div>
        </div>
      </div>

      <div class="panel">
        <h3>🧾 Recent Sales</h3>
        <p style="font-size: 12px; color: var(--muted); margin-bottom: 12px;">Latest transactions in the store</p>
        <div class="table-wrap" id="recentSales"></div>
      </div>
    </section>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
