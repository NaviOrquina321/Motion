<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers - Quick Buy Retail</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><h1>Customers</h1><span class="user-chip" id="userInfo"></span></header>
    <section class="content">
      <div class="toolbar"><input class="grow" type="text" id="search" placeholder="Search by name, contact, email or ID..."><button class="btn" id="addBtn">+ Add Customer</button></div>
      <div class="panel"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Full Name</th><th>Contact</th><th>Email</th><th>Address</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
      <div class="modal" id="formModal"><form class="modal-box" id="form" novalidate><h2 id="formTitle">Add Customer</h2>
        <input type="hidden" id="id">
        <div class="field"><label>Full Name *</label><input type="text" id="full_name" maxlength="100"></div>
        <div class="row2"><div class="field"><label>Contact Number</label><input type="text" id="contact_number" maxlength="20"></div>
        <div class="field"><label>Email</label><input type="email" id="email" maxlength="120"></div></div>
        <div class="field"><label>Address</label><input type="text" id="address" maxlength="255"></div>
        <div class="form-error" id="formError"></div>
        <div class="modal-actions"><button type="button" class="btn btn-light" data-close="formModal">Cancel</button><button class="btn">Save</button></div>
      </form></div>
    </section>
  </main>
</div>
<script src="js/common.js"></script><script src="js/customers.js"></script>
</body></html>
