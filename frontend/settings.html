<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Quick Buy Retail</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1>Store Settings</h1>
      <span class="user-chip" id="userInfo"></span>
    </header>
    <section class="content">
      <div style="max-width: 600px;" class="panel">
        <h2>⚙️ Configuration & Tax</h2>
        <form id="settingsForm" style="margin-top: 16px;">
          <div class="field">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer">
              <input type="checkbox" id="tax_enabled" style="width:auto"> Enable Tax / VAT on POS Sales
            </label>
          </div>
          <div class="field">
            <label>Tax Rate (%)</label>
            <input type="number" id="tax_rate" min="0" max="100" step="0.01" placeholder="12.00">
          </div>
          <div class="field">
            <label>Receipt Header Title</label>
            <input type="text" id="receipt_header" placeholder="QUICK BUY RETAIL">
          </div>
          <div class="field">
            <label>Receipt Footer Note</label>
            <input type="text" id="receipt_footer" placeholder="Thank you for shopping!">
          </div>
          <div class="form-error" id="formError"></div>
          <button class="btn btn-ok" type="submit">Save Settings</button>
        </form>
      </div>
    </section>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
