<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movement History - Quick Buy Retail</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1>Movement History</h1>
      <span class="user-chip" id="userInfo"></span>
    </header>
    <section class="content">
      <div class="toolbar">
        <input class="grow" type="text" id="search" placeholder="Search product, user, or reason...">
        <select id="typeFilter">
          <option value="">All Movement Types</option>
          <option value="received">Received (+)</option>
          <option value="sold">Sold (-)</option>
          <option value="damaged">Damaged (-)</option>
          <option value="expired">Expired (-)</option>
          <option value="returned">Returned (+)</option>
          <option value="adjustment">Adjustment</option>
        </select>
        <label>From <input type="date" id="from"></label>
        <label>To <input type="date" id="to"></label>
        <button class="btn btn-light" id="resetBtn">Reset</button>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Date & Time</th>
                <th>Product</th>
                <th>Type</th>
                <th class="num">Quantity</th>
                <th>Reason / Reference</th>
                <th>Staff</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/movements.js"></script>
</body>
</html>
