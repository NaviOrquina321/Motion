<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login & Register - Quick Buy Retail</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="login-wrap">
  <div class="login-card">
    <h1>🛍️ Quick Buy Retail</h1>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLoginBtn">Sign In</button>
      <button type="button" class="auth-tab" id="tabRegisterBtn">Register</button>
    </div>
    <p id="authSubtitle">Sign in to continue</p>
    <div class="alert alert-error hidden" id="authError"></div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="field"><label for="username">Username</label><input type="text" id="username" autocomplete="username" autofocus></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw-wrap"><input type="password" id="password" autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pwToggle">Show</button></div></div>
      <button class="btn" style="width:100%" id="loginBtn" type="submit">Login</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden" novalidate>
      <div class="field"><label for="regFullName">Full Name</label><input type="text" id="regFullName" autocomplete="name"></div>
      <div class="field"><label for="regUsername">Username</label><input type="text" id="regUsername" autocomplete="username"></div>
      <div class="field"><label for="regPassword">Password</label>
        <div class="pw-wrap"><input type="password" id="regPassword" autocomplete="new-password">
        <button type="button" class="pw-toggle" id="regPwToggle">Show</button></div></div>
      <button class="btn" style="width:100%" id="regBtn" type="submit">Create Account</button>
    </form>
  </div>
</div>
<script src="js/common.js"></script><script src="js/login.js"></script>
</body></html>
